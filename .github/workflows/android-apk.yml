name: MyStreamFlix Flutter Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Flutter platforms
        run: flutter create --project-name mystreamflix_flutter --org com.mystreamflix --platforms=android,ios,windows .
      - name: Add Android network permission
        run: python3 scripts/configure_android.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build Android APK (release, no signing key)
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://mystreamflix.biz.id' }}
      - uses: actions/upload-artifact@v4
        with:
          name: MyStreamFlix-Flutter-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

name: Set MBox App Name

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update Android, TV and Windows naming/build hooks
        run: python3 scripts/rename_mbox.py
      - name: Validate patch
        run: |
          python3 -m py_compile scripts/rename_mbox.py
          grep -q 'android:label="MBox"' android/app/src/main/AndroidManifest.xml
          git diff --check
      - name: Commit app name changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No tracked changes: app name already configured.'
          else
            git commit -m 'Set MBox display name across platforms'
            git push
          fi

name: Fix MBox Flutter Analyze (All Platforms)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Fix Dart analyzer issues
        run: python3 scripts/fix_mbox_analyzer.py
      - name: Check patch format
        run: git diff --check
      - name: Commit corrected Dart source files
        shell: bash
        run: |
          git add lib/screens/settings_screen.dart lib/state/app_state.dart
          if git diff --cached --quiet; then
            echo 'Source files already fixed; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve MBox analyzer warnings for all platforms'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

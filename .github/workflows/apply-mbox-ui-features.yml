name: Apply MBox UI Features

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current MBox source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply updates without replacing existing player
        run: python3 scripts/apply_mbox_features.py
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and format changes
        run: |
          flutter pub get
          dart format lib/main.dart lib/screens/shell_screen.dart lib/screens/settings_screen.dart lib/screens/player_screen.dart lib/screens/mbox_splash_screen.dart lib/utils/catalog_sort.dart test/catalog_sort_test.dart
      - name: Analyze all platforms' shared Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run sorting tests
        run: flutter test test/catalog_sort_test.dart
      - name: Commit verified updates to the current branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/main.dart lib/screens/shell_screen.dart lib/screens/settings_screen.dart lib/screens/player_screen.dart lib/screens/mbox_splash_screen.dart lib/utils/catalog_sort.dart test/catalog_sort_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Add MBox startup intro, sorting, exit confirmation and player gestures'
            git push
          else
            echo 'No source changes to commit.'
          fi
